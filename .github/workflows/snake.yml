name: Generate Snake Contribution Animation

on:
      # Schedule runs every 12 hours
   schedule:
      - cron: "0 */12 * * *"

      # Allows you to manually run the job at any time
   workflow_dispatch:
      # Run on every push to main
   push:
    branches:
     - main
jobs:
      generate:
        permissions:
          contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
          - name: Generate contribution snake SVG animations
            uses: Platane/snk/svg-only@v3
            with:
              github_user_name: ${{ github.repository_owner }}
              outputs: |
                dist/github-contribution-grid-snake.svg
                dist/github-contribution-grid-snake-dark.svg?palette=github-dark

          - name: Push generated SVGs to the output branch
            uses: crazy-max/ghaction-github-pages@v4
            with:
              target_branch: output
              build_dir: dist
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
